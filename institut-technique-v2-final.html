<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16211D">
<title>Institut Technique Rougeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#16211D; --encre-2:#20302A; --papier:#F6F4EE; --carte:#FFFFFF;
  --rouge:#C3122F; --serre:#1F6F52; --serre-fonce:#0E4F3A; --ambre:#DE9B1F;
  --trait:#D8DDD6; --ardoise:#68746D; --sable:#EDEAE1;
  --r:3px;
  --ombre:0 1px 2px rgba(22,33,29,.06), 0 8px 24px -12px rgba(22,33,29,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papier); color:var(--encre);
  font-family:'Public Sans',system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Archivo',system-ui,sans-serif; margin:0; line-height:1.15; letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',monospace}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--serre)}

/* ---------- PAGE LOGIN ---------- */
#loginPage{
  display:flex; align-items:center; justify-content:center; min-height:100vh;
  background:var(--papier); position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:1000;
}
#loginPage.hidden{ display:none; }
.login-container{
  max-width:420px; width:100%; margin:20px; padding:40px;
  background:var(--carte); border:1px solid var(--trait); border-radius:8px;
  box-shadow:var(--ombre);
}
.login-container h1{font-size:28px; margin-bottom:8px; text-align:center}
.login-container .subtitle{text-align:center; color:var(--ardoise); margin-bottom:24px; font-size:14px}
.form-group{margin-bottom:16px}
.form-group label{display:block; font-size:13px; font-weight:500; margin-bottom:6px}
.form-group input{
  width:100%; padding:10px 12px; border:1px solid var(--trait); border-radius:var(--r);
  font-size:14px;
}
.form-group input:focus{outline:none; border-color:var(--serre); box-shadow:0 0 0 2px rgba(31,111,82,0.1)}
.btn-login{
  width:100%; padding:12px; background:var(--serre); color:#fff; border:none;
  border-radius:var(--r); font-weight:500; font-size:14px; cursor:pointer; margin-top:8px;
}
.btn-login:hover{background:var(--serre-fonce)}
.error-msg{color:var(--rouge); font-size:13px; margin-top:8px; text-align:center}
.info-box{background:var(--sable); padding:12px; border-radius:var(--r); margin-bottom:20px; font-size:13px}
.info-box p{margin:0 0 6px}
.info-box code{background:#fff; padding:2px 4px; border-radius:2px; font-family:'IBM Plex Mono'}

/* ---------- Formulaires ---------- */
.form-group{margin-bottom:16px}
.form-group label{display:block; font-size:13px; font-weight:500; margin-bottom:6px}
.form-group input, .form-group select{
  width:100%; padding:10px 12px; border:1px solid var(--trait); border-radius:var(--r);
  font-size:14px;
}
.form-group input:focus, .form-group select:focus{
  outline:none; border-color:var(--serre); box-shadow:0 0 0 2px rgba(31,111,82,0.1)
}

/* ---------- Barre haute ---------- */
.topbar{
  position:sticky; top:0; z-index:50; background:var(--encre); color:#fff;
  padding:env(safe-area-inset-top) 0 0;
}
.topbar-in{display:flex;align-items:center;gap:14px;padding:12px 18px;max-width:1180px;margin:0 auto}
.logo{
  font-family:'Archivo';font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;white-space:nowrap
}
.logo .pastille{width:9px;height:9px;background:var(--rouge);border-radius:50%;display:inline-block;flex:none}
.logo small{display:block;font-size:9.5px;letter-spacing:.2em;color:#8FA096;font-weight:500;margin-top:2px}
.topbar .user{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#8FA096}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--serre);color:#fff;display:grid;place-items:center;
  font-size:10px;font-weight:700;font-family:'IBM Plex Mono'}

.btn-logout{
  background:transparent; border:1px solid rgba(255,255,255,.3); color:#fff;
  padding:6px 12px; border-radius:var(--r); cursor:pointer; font-size:11px;
  font-weight:600; margin-left:12px;
}
.btn-logout:hover{ border-color:#fff; background:rgba(255,255,255,.05); }

/* ---------- Navigation ---------- */
nav.rail{background:var(--encre-2);border-top:1px solid rgba(255,255,255,.07)}
.rail-in{display:flex;gap:2px;max-width:1180px;margin:0 auto;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.rail-in::-webkit-scrollbar{display:none}
.rail button{
  background:none;border:0;padding:11px 13px 10px;color:#93A49A;white-space:nowrap;
  font-family:'Archivo';font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  border-bottom:2px solid transparent;transition:color .15s
}
.rail button:hover{color:#D6DED8}
.rail button[aria-current="true"]{color:#fff;border-bottom-color:var(--rouge)}
.rail .num{font-family:'IBM Plex Mono';font-size:9.5px;color:#5E6F65;margin-right:6px}
.rail button[aria-current="true"] .num{color:var(--rouge)}

/* ---------- Structure ---------- */
main{max-width:1180px;margin:0 auto;padding:22px 18px 90px}
@media (max-width: 768px) { main { padding: 16px 12px 80px; } .form-group input, .form-group select { font-size: 16px; } table { font-size: 12px; } .topbar-in { flex-wrap: wrap; } }
.vue{display:none}
.vue.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.entete{border-bottom:1px solid var(--trait);padding-bottom:16px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ardoise)}
.entete h2{font-size:clamp(22px,4vw,30px);font-weight:600;margin-top:5px}
.entete p{margin:7px 0 0;color:var(--ardoise);font-size:13.5px;max-width:70ch}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--trait);
  border:1px solid var(--trait);margin-bottom:22px}
.stat{background:var(--carte);padding:12px 14px}
.stat b{display:block;font-family:'Archivo';font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat span{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ardoise)}

/* ---------- Grille de couverture (signature) ---------- */
.grille-wrap{background:var(--carte);border:1px solid var(--trait);margin-bottom:22px}
.grille-tete{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--trait)}
.grille-tete h3{font-size:14px;font-weight:600;letter-spacing:.02em}
.grille-tete .aide{font-size:12px;color:var(--ardoise)}
.grille-scroll{overflow-x:auto}
table.grille{border-collapse:collapse;width:100%;min-width:640px}
table.grille th,table.grille td{padding:0;text-align:center}
table.grille thead th{
  font-family:'IBM Plex Mono';font-size:9.5px;font-weight:500;letter-spacing:.07em;color:var(--ardoise);
  padding:9px 4px;border-bottom:1px solid var(--trait);text-transform:uppercase}
table.grille thead th:first-child{text-align:left;padding-left:16px;min-width:190px}
table.grille tbody th{
  text-align:left;font-family:'Public Sans';font-size:12.5px;font-weight:500;padding:0 10px 0 16px;
  border-bottom:1px solid var(--sable);white-space:nowrap}
table.grille tbody th button{background:none;border:0;padding:8px 0;font:inherit;text-align:left;width:100%}
table.grille tbody th button:hover{color:var(--rouge)}
.tuile{display:block;width:100%;height:30px;border:1px solid var(--carte);color:#fff;
  font-family:'IBM Plex Mono';font-size:11.5px;font-weight:500;display:grid;place-items:center}
.n0{background:var(--rouge)} .n1{background:var(--ambre);color:#3C2A05} .n2{background:var(--serre)} .n3{background:var(--serre-fonce)}
.bande{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ardoise);
  background:var(--sable);padding:6px 16px;text-align:left!important}
.legende{display:flex;flex-wrap:wrap;gap:14px;padding:12px 16px;border-top:1px solid var(--trait);font-size:11.5px;color:var(--ardoise)}
.legende span{display:flex;align-items:center;gap:6px}
.puce{width:11px;height:11px;display:inline-block;flex:none}

/* ---------- Filtres ---------- */
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.chip{background:var(--carte);border:1px solid var(--trait);padding:6px 13px;border-radius:99px;
  font-size:12.5px;transition:.15s}
.chip:hover{border-color:var(--ardoise)}
.chip[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:#fff}
.recherche{flex:1;min-width:170px;position:relative}
.recherche input{width:100%;padding:7px 12px;border:1px solid var(--trait);background:var(--carte);border-radius:99px;font-size:13px}
.recherche input:focus{outline:2px solid var(--serre);outline-offset:1px}

/* ---------- Cartes enjeux ---------- */
.enjeu{background:var(--carte);border:1px solid var(--trait);margin-bottom:10px}
.enjeu-tete{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.enjeu-tete:focus-visible{outline:2px solid var(--serre);outline-offset:-2px}
.enjeu-tete:hover{background:#FCFBF8}
.enjeu-tete .barre{width:4px;align-self:stretch;flex:none;background:var(--serre)}
.enjeu.renfort .enjeu-tete .barre{background:var(--ambre)}
.enjeu-tete h3{font-size:15.5px;font-weight:600;letter-spacing:.01em}
.enjeu-tete p{margin:4px 0 0;font-size:12.5px;color:var(--ardoise);max-width:62ch}
.tag{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border:1px solid currentColor;white-space:nowrap}
.tag.strat{color:var(--serre)} .tag.renf{color:#A9760A}
.enjeu-meta{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.score{font-family:'IBM Plex Mono';font-size:11px;padding:4px 8px;color:#fff}
.chevron{color:var(--ardoise);font-size:12px;transition:transform .2s}
.enjeu.ouvert .chevron{transform:rotate(90deg)}
.enjeu-corps{display:none;border-top:1px solid var(--trait);padding:4px 16px 18px}
.enjeu.ouvert .enjeu-corps{display:block}

.sous{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ardoise);
  margin:20px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--sable)}
.struct{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #F0EEE7;font-size:13px}
.struct .nom{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em}
.struct .liste{color:var(--encre)}
.struct .vide{color:var(--ardoise);font-style:italic}
.badge{font-family:'IBM Plex Mono';font-size:10px;padding:2px 7px;color:#fff;white-space:nowrap}
.temps{width:74px;padding:3px 6px;border:1px solid var(--trait);font-size:11.5px;font-family:'IBM Plex Mono';background:#FCFBF8}
.action{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #F0EEE7;font-size:13.5px}
.action .txt{flex:1}
.action .pilote{display:block;font-size:11.5px;color:var(--ardoise);margin-top:2px}
.etat{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;
  border:1px solid var(--trait);white-space:nowrap;background:none}
.etat.ok{background:var(--serre);color:#fff;border-color:var(--serre)}
.etat.part{background:var(--ambre);color:#3C2A05;border-color:var(--ambre)}
.etat.non{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.etat.val{background:var(--encre);color:#fff;border-color:var(--encre)}
.ind-liste{margin:0;padding-left:18px;font-size:13px;color:var(--encre-2)}
.ind-liste li{margin:3px 0}

/* ---------- Tableaux génériques ---------- */
.tableau{background:var(--carte);border:1px solid var(--trait);overflow-x:auto}
table.data{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
table.data th{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ardoise);
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--trait);background:#FCFBF8;position:sticky;top:0}
table.data td{padding:8px 12px;border-bottom:1px solid #F0EEE7;vertical-align:top}
table.data tr.groupe td{background:var(--sable);font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--encre)}
table.data input{width:100%;border:1px solid transparent;background:none;padding:3px 5px;font-family:'IBM Plex Mono';font-size:12px}
table.data input:hover{border-color:var(--trait);background:#fff}
table.data input:focus{outline:0;border-color:var(--serre);background:#fff}
.cible{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--ardoise)}

/* ---------- Réunions ---------- */
.semainier{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--carte);border:1px solid var(--trait);padding:12px 14px;margin-bottom:16px}
.semainier .fleche{width:30px;height:30px;border:1px solid var(--trait);background:var(--carte);display:grid;place-items:center}
.semainier .fleche:hover{border-color:var(--encre)}
.semainier .sem{font-family:'Archivo';font-size:19px;font-weight:600}
.semainier .dates{font-family:'IBM Plex Mono';font-size:11px;color:var(--ardoise)}
.rdv{background:var(--carte);border:1px solid var(--trait);border-left:3px solid var(--serre);padding:12px 14px;margin-bottom:8px;display:flex;gap:12px}
.rdv.commission{border-left-color:var(--rouge)}
.rdv.temps-fort{border-left-color:var(--ambre)}
.rdv .quand{font-family:'IBM Plex Mono';font-size:11px;color:var(--ardoise);min-width:96px;flex:none}
.rdv h4{font-size:14px;font-weight:600}
.rdv p{margin:3px 0 0;font-size:12.5px;color:var(--ardoise)}
.rdv .lien{font-size:12px;margin-top:6px;display:inline-block}

/* ---------- Commissions ---------- */
.onglets-com{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.carte{background:var(--carte);border:1px solid var(--trait);padding:16px;margin-bottom:14px}
.carte > h3{font-size:14px;font-weight:600;margin-bottom:3px}
.carte > .aide{font-size:12.5px;color:var(--ardoise);margin:0 0 14px}
.deux{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.deux{grid-template-columns:1.25fr 1fr}}
#carteSvg{width:100%;height:auto;display:block}
.bassin-info{font-size:12.5px;color:var(--ardoise);margin-top:10px;border-top:1px solid var(--sable);padding-top:10px}
.membre{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #F0EEE7;font-size:13px}
.membre .st{font-family:'IBM Plex Mono';font-size:10px;color:var(--ardoise);letter-spacing:.06em}
.doc{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid #F0EEE7}
.doc .ico{width:30px;height:30px;flex:none;display:grid;place-items:center;background:var(--sable);
  font-family:'IBM Plex Mono';font-size:9px;font-weight:600;color:var(--encre)}
.doc .t{flex:1;font-size:13.5px}
.doc .t small{display:block;color:var(--ardoise);font-size:11.5px;font-family:'IBM Plex Mono'}
.doc a{font-size:12px;white-space:nowrap}
.varietes{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.variete{border:1px solid var(--trait);padding:12px;background:#FCFBF8}
.variete h4{font-size:14px;font-weight:600}
.variete .seg{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ardoise);margin:3px 0 8px}
.variete .champ{font-size:12px;color:var(--ardoise);margin:2px 0}
.variete .champ b{color:var(--encre);font-weight:500}
.commentaires{margin-top:9px;border-top:1px solid var(--trait);padding-top:8px}
.commentaire{font-size:12px;background:#fff;border:1px solid var(--trait);padding:6px 8px;margin-bottom:5px}
.commentaire small{display:block;font-family:'IBM Plex Mono';font-size:9.5px;color:var(--ardoise);margin-bottom:2px}
.ajout{display:flex;gap:5px;margin-top:6px}
.ajout input{flex:1;padding:5px 8px;border:1px solid var(--trait);font-size:12px;background:#fff}
.ajout button{background:var(--encre);color:#fff;border:0;padding:5px 11px;font-size:11.5px}
.photo-btn{margin-top:6px;width:100%;background:none;border:1px dashed var(--trait);padding:7px;font-size:11.5px;color:var(--ardoise)}
.photo-btn:hover{border-color:var(--serre);color:var(--serre)}

/* ---------- Liens & BI ---------- */
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lien-tuile{background:var(--carte);border:1px solid var(--trait);padding:14px;display:block;text-decoration:none;color:inherit;transition:.15s}
.lien-tuile:hover{border-color:var(--encre);box-shadow:var(--ombre)}
.lien-tuile .src{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ardoise)}
.lien-tuile h4{font-size:14.5px;font-weight:600;margin:5px 0 4px}
.lien-tuile p{margin:0;font-size:12.5px;color:var(--ardoise)}
.lien-tuile .fleche2{margin-top:9px;font-size:12px;color:var(--serre);font-weight:600}

/* ---------- Annuaire ---------- */
.experts{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:9px}
.expert{background:var(--carte);border:1px solid var(--trait);padding:12px 14px}
.expert h4{font-size:14px;font-weight:600}
.expert .st{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.08em;color:var(--ardoise);margin:2px 0 7px}
.expert .enj{font-size:11.5px;color:var(--encre-2);line-height:1.45}
.expert .compte{display:flex;gap:5px;margin-top:8px}
.expert .compte span{font-family:'IBM Plex Mono';font-size:9.5px;padding:2px 6px;background:var(--sable)}
.alerte{background:#FDF3F5;border-left:3px solid var(--rouge)}

.note{font-size:12px;color:var(--ardoise);background:var(--sable);border-left:3px solid var(--ardoise);
  padding:10px 13px;margin:16px 0}
.note b{color:var(--encre)}
.enregistre{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--encre);
  color:#fff;padding:8px 16px;font-size:12.5px;z-index:99;transition:transform .25s;font-family:'IBM Plex Mono'}
.enregistre.on{transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){
  main{padding:16px 12px 80px}
  .struct{grid-template-columns:1fr;gap:3px}
  .struct .badge{justify-self:start}
  .rdv{flex-direction:column;gap:5px}
  .stat b{font-size:22px}
}
</style>
</head>
<body>

<!-- ========== PAGE LOGIN ========== -->
<div id="loginPage">
  <div class="login-container">
    <h1>Institut Technique</h1>
    <p class="subtitle">Rougeline</p>
    
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="email@example.com">
    </div>
    
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="loginPassword" placeholder="••••••">
      <div id="loginError" class="error-msg"></div>
    </div>
    
    <button class="btn-login" onclick="handleLogin()">Se connecter</button>
  </div>
</div>

<!-- ========== PAGE APP ========== -->
<div id="appPage" style="display:none;">
<header class="topbar">
  <div class="topbar-in">
    <div class="logo"><span class="pastille"></span><span>Institut Technique<small>Rougeline · Projet 25-30</small></span></div>
    <div class="user"><span id="userNom">Équipe technique</span><span class="avatar">IT</span><button class="btn-logout" onclick="handleLogout()">Déconnexion</button></div>
  </div>
  <nav class="rail"><div class="rail-in" id="railNav"></div></nav>
</header>

<main>
  <section class="vue on" id="v-cartographie"></section>
  <section class="vue" id="v-indicateurs"></section>
  <section class="vue" id="v-reunions"></section>
  <section class="vue" id="v-commissions"></section>
  <section class="vue" id="v-liens"></section>

function ligneMatrice(type){

function listerEnjeux(){

    return (e.nom+' '+e.objectif+' '+e.animations+' '+
            e.structures.map(s=>s.e.join(' ')).join(' ')+' '+
            e.a25.map(a=>a.a+a.p).join(' ')+' '+e.a26.map(a=>a.a+a.p).join(' ')).toLowerCase().includes(q);

/* ============ 03 · Réunions ============ */
let semaine = numSemaine(new Date());
function numSemaine(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const j=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-j);
  return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7); }
function datesSemaine(n,an){ const s=new Date(an,0,1+(n-1)*7);
  const j=s.getDay()||7; s.setDate(s.getDate()-j+1); const f=new Date(s); f.setDate(s.getDate()+4);
  const fmt=d=>d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); return fmt(s)+' → '+fmt(f); }

function rdvSemaine(n){
  const out=[];
  out.push({q:'Lundi · 09h00', t:'Point technique UDC', d:'Tour des enjeux, arbitrages de la semaine, points bloquants.', c:'', lien:'Teams'});
  const e = D.enjeux[(n-1)%D.enjeux.length];
  out.push({q:'Mardi · 14h00', t:'Revue d\'enjeu — '+e.nom, d:'Rotation sur les 13 enjeux : avancement des actions, indicateurs, besoins d\'expertise.', c:'', lien:'Ouvrir l\'enjeu', vue:e.nom});
  if(n%4===3) out.push({q:'Jeudi · 09h30', t:'Commission Variétale Tomates', d:'Résultats d\'essais du mois, liste positive, points semenciers.', c:'commission', lien:'Espace commission'});
  if(n%4===1) out.push({q:'Jeudi · 09h30', t:'Commission Variétale Fraises', d:'Essais variétaux, plans de développement 22L01 / 22L04.', c:'commission', lien:'Espace commission'});
  if(n%6===2) out.push({q:'Mardi · 09h00', t:'Commission Sanitaire', d:'Essais, retraits de produits, fiches stratégies.', c:'commission', lien:'Espace commission'});
  if(n%6===5) out.push({q:'Vendredi · 10h00', t:'Commission Agro-Tech Innovation', d:'Veille start-ups, retours d\'expérience outils (IUNU, Blue Radix, FravEYE).', c:'commission', lien:'Espace commission'});
  if(n===12||n===38) out.push({q:'Semaine', t:'Séminaire technique', d:'Deux jours, toutes les équipes techniques OPs + UDC.', c:'temps-fort'});
  if(n===18||n===24) out.push({q:'Semaine', t:'Rallye technique', d:'Visites d\'exploitations, diffusion des fiches bonnes pratiques.', c:'temps-fort'});
  if(n%13===0) out.push({q:'Vendredi · 14h00', t:'Comité de pilotage Institut Technique', d:'Revue trimestrielle : couverture des enjeux, indicateurs, plan de formation.', c:'temps-fort'});
  return out;
}

  svg.innerHTML=`

async function changerMotDePasse(){
  const pwd1 = document.getElementById('profilPassword').value;
  const pwd2 = document.getElementById('profilPassword2').value;
  const errorEl = document.getElementById('profilError');
  
  if(!pwd1 || !pwd2){
    errorEl.textContent = 'Tous les champs sont obligatoires';
    return;
  }
  
  if(pwd1 !== pwd2){
    errorEl.textContent = 'Les mots de passe ne correspondent pas';
    return;
  }
  
  if(pwd1.length < 8){
    errorEl.textContent = 'Le mot de passe doit faire au moins 8 caractères';
    return;
  }
  
  try {
    const { error } = await sbClient.auth.updateUser({ password: pwd1 });
    if(error) throw error;
    
    errorEl.textContent = '';
    toast('Mot de passe changé avec succès !');
    document.getElementById('profilPassword').value = '';
    document.getElementById('profilPassword2').value = '';
  } catch(err){
    errorEl.textContent = 'Erreur : ' + err.message;
  }
}

      html += `
        <tr style="border-bottom:1px solid var(--sable);">
          <td style="padding:12px;">${user.name || 'N/A'}</td>
          <td style="padding:12px;">${user.email}</td>
          <td style="padding:12px; text-align:center;">
            <select onchange="changerRole('${user.id}', this.value)" style="padding:6px; border:1px solid var(--trait); border-radius:3px;">
              <option value="VIEWER" ${user.role === 'VIEWER' ? 'selected' : ''}>Lecteur</option>
              <option value="EDITOR" ${user.role === 'EDITOR' ? 'selected' : ''}>Éditeur</option>
              <option value="ADMIN" ${user.role === 'ADMIN' ? 'selected' : ''}>Admin</option>
            </select>
          </td>
          <td style="padding:12px; text-align:center;">
            <button onclick="supprimerUtilisateur('${user.id}', '${user.email}')" style="background:var(--rouge); color:#fff; padding:6px 12px; border:none; border-radius:3px; cursor:pointer; font-size:12px; font-weight:500;">
              Supprimer
            </button>
          </td>
        </tr>
      `;
    });
    
    html += '</tbody></table>';
    listEl.innerHTML = html;
    
  } catch(err){
    const listEl = document.getElementById('adminUsersList');
    if(listEl) listEl.innerHTML = '<p style="color:var(--rouge);">Erreur : ' + err.message + '</p>';
  }
}

async function chargerUtilisateursProfil(){
  try {
    const { data, error } = await sbClient
      .from('users')
      .select('id, email, name, role')
      .order('created_at', { ascending: false });
    
    if(error) throw error;
    
    const listEl = document.getElementById('profilUsersList');
    
    if(!data || data.length === 0){
      listEl.innerHTML = '<p style="text-align:center; color:var(--ardoise);">Aucun utilisateur</p>';
      return;
    }
    
    let html = '<table style="width:100%; border-collapse:collapse;">';
    html += '<thead><tr style="border-bottom:2px solid var(--trait);"><th style="text-align:left; padding:12px; font-weight:600; font-size:13px;">Nom</th><th style="text-align:left; padding:12px; font-weight:600; font-size:13px;">Email</th><th style="text-align:center; padding:12px; font-weight:600; font-size:13px;">Rôle</th><th style="text-align:center; padding:12px; font-weight:600; font-size:13px;">Action</th></tr></thead>';
    html += '<tbody>';
    
    data.forEach(user => {
      const badgeColor = user.role === 'ADMIN' ? 'var(--rouge)' : user.role === 'EDITOR' ? 'var(--ambre)' : 'var(--serre)';
      const isCurrentUser = user.email === currentUser?.email;
      
      html += `
        <tr style="border-bottom:1px solid var(--sable);">
          <td style="padding:12px; font-weight:500;">${user.name || 'N/A'} ${isCurrentUser ? '<span style="color:var(--ardoise); font-size:11px;">(Vous)</span>' : ''}</td>
          <td style="padding:12px; color:var(--ardoise); font-size:13px;">${user.email}</td>
          <td style="padding:12px; text-align:center;">
            <span style="background:${badgeColor}; color:#fff; padding:4px 10px; border-radius:3px; font-weight:600; font-size:11px;">${user.role}</span>
          </td>
          <td style="padding:12px; text-align:center;">
            ${!isCurrentUser ? `
              <button onclick="supprimerUtilisateurProfil('${user.id}', '${user.email}')" style="background:transparent; border:none; cursor:pointer; font-size:16px; padding:4px 8px; border-radius:3px; transition:0.2s;" onmouseover="this.style.background='rgba(195,18,47,0.1)'" onmouseout="this.style.background='transparent'" title="Supprimer">
                🗑️
              </button>
            ` : `
              <span style="color:var(--ardoise); font-size:12px;">-</span>
            `}
          </td>
        </tr>
      `;
    });
    
    html += '</tbody></table>';
    listEl.innerHTML = html;
    
  } catch(err){
    const listEl = document.getElementById('profilUsersList');
    if(listEl) listEl.innerHTML = '<p style="color:var(--rouge);">Erreur : ' + err.message + '</p>';
  }
}

async function supprimerUtilisateurProfil(userId, email){
  if(!confirm(`Êtes-vous sûr de vouloir supprimer ${email} ?`)){
    return;
  }
  
  try {
    // Supprimer de la table users
    const { error: err1 } = await sbClient
      .from('users')
      .delete()
      .eq('id', userId);
    
    if(err1) throw err1;
    
    toast('Utilisateur supprimé');
    chargerUtilisateursProfil(); // Recharger la liste
    
  } catch(err){
    toast('Erreur : ' + err.message);
  }
}

async function changerRole(userId, newRole){
  try {
    const { error } = await sbClient
      .from('users')
      .update({ role: newRole })
      .eq('id', userId);
    
    if(error) throw error;
    toast('Rôle modifié !');
  } catch(err){
    toast('Erreur : ' + err.message);
  }
}

async function supprimerUtilisateur(userId, email){
  if(!confirm(`Êtes-vous sûr de vouloir supprimer ${email} ?`)){
    return;
  }
  
  try {
    // Supprimer de la table users
    const { error: err1 } = await sbClient
      .from('users')
      .delete()
      .eq('id', userId);
    
    if(err1) throw err1;
    
    toast('Utilisateur supprimé');
    chargerUtilisateurs(); // Recharger la liste
    
  } catch(err){
    toast('Erreur : ' + err.message);
  }
}

async function creerUtilisateur(){
  const email = document.getElementById('adminEmail').value;
  const name = document.getElementById('adminName').value;
  const password = document.getElementById('adminPassword').value;
  const role = document.getElementById('adminRole').value;
  const errorEl = document.getElementById('adminError');
  
  if(!email || !name || !password){
    errorEl.textContent = 'Tous les champs sont obligatoires';
    return;
  }
  
  if(!email.includes('@')){
    errorEl.textContent = 'Email invalide';
    return;
  }
  
  if(password.length < 8){
    errorEl.textContent = 'Le mot de passe doit faire au moins 8 caractères';
    return;
  }
  
  try {
    toast('Utilisateur à créer manuellement dans Supabase Dashboard');
    errorEl.textContent = '📌 Pour créer cet utilisateur : allez sur Supabase Dashboard → Authentication → Users → Add user. Email: ' + email + ' | Password: ' + password + ' | Puis ajouter dans la table users avec le rôle ' + role;
    
  } catch(err){
    errorEl.textContent = 'Erreur : ' + err.message;
  }
}
